run_type        = "staged_learning"
device          = "cpu"
tb_logdir       = "/Users/vishnukasturi/Intern/reinvent-local/tb_jak2_rl_run6"
json_out_config = "json_jak2_rl_run6.json"

[parameters]
use_checkpoint     = false
summary_csv_prefix = "/Users/vishnukasturi/Intern/reinvent-local/results/jak2_rl_run6"

prior_file = "/Users/vishnukasturi/Intern/reinvent-local/models/jak2_tl.model"
agent_file = "/Users/vishnukasturi/Intern/reinvent-local/models/jak2_tl.model"

batch_size        = 64
unique_sequences  = true
randomize_smiles  = true

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[diversity_filter]
type        = "IdenticalTopologicalScaffold"
bucket_size = 25
minscore    = 0.40

[inception]
smiles_file = "/Users/vishnukasturi/Intern/reinvent-local/data/jak2_rl_inception.smi"
memory_size = 200
sample_size = 20

##############################################################################
# STAGE 1: Multi-parameter Optimization (150 steps)
# ############################################################################
[[stage]]
chkpt_file  = "/Users/vishnukasturi/Intern/reinvent-local/models/jak2_rl_run6.chkpt"
termination = "simple"
max_score   = 0.0
min_steps   = 150
max_steps   = 150

[stage.scoring]
type = "geometric_mean"

# ── SA Score ──────────────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name              = "SAScore"
weight            = 2.0
transform.type    = "reverse_sigmoid"
transform.high    = 5.0
transform.low     = 2.0
transform.k       = 0.5

# ── JAK2 pIC50 ────────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.JAK2pIC50]
[[stage.scoring.component.JAK2pIC50.endpoint]]
name               = "JAK2pIC50_raw"
weight             = 5.0
transform.type     = "sigmoid"
transform.high     = 10.0
transform.low      = 6.0
transform.k        = 0.5
params.model_path  = "/Users/vishnukasturi/Intern/reinvent-local/Preprocess/final_acc/jak2_pic50_final_acc_model.ubj"
params.scaler_path = "/Users/vishnukasturi/Intern/reinvent-local/Preprocess/final_acc/jak2_pic50_final_acc_scaler.pkl"

# ── Solubility ────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.PD1PDL1Sol]
[[stage.scoring.component.PD1PDL1Sol.endpoint]]
name               = "PD1PDL1Sol_raw"
weight             = 2.0
transform.type     = "sigmoid"
transform.high     = -2.0
transform.low      = -6.0
transform.k        = 0.5
params.model_path  = "/Users/vishnukasturi/Intern/reinvent-local/Preprocess/final_acc/pd1_pdl1_sol_final_acc_model.ubj"
params.scaler_path = "/Users/vishnukasturi/Intern/reinvent-local/Preprocess/final_acc/pd1_pdl1_sol_final_acc_scaler.pkl"

# ── Fused Ring Reward ─────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.FusedRingReward]
[[stage.scoring.component.FusedRingReward.endpoint]]
name   = "FusedRingReward"
weight = 3.0
