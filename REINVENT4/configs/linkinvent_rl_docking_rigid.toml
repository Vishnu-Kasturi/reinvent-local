##############################################################################
# linkinvent_rl_docking_rigid.toml
# LinkInvent RL — 4 rewards only:
#   1. LowLinkerCsp3      — low sp3 fraction in linker (hard gate)
#   2. ZeroRotBonds       — exactly 0 rotatable bonds in linker
#   3. LinkerSpan_7_11    — effective length 7–11 bonds between warheads
#   4. DockingReward      — GNINA tiered affinity
#
# Run:
#   reinvent /path/to/linkinvent_rl_docking_rigid.toml
##############################################################################

run_type        = "staged_learning"
device          = "cuda:0"
tb_logdir       = "tb_linkinvent_rigid"
json_out_config = "json_linkinvent_rigid.json"

[parameters]
prior_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/linkinvent.prior"
agent_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/linkinvent.prior"
smiles_file        = "/home/genai/Vishnu/psearch-master/reinvent-local-main/data/warheads_1.smi"
summary_csv_prefix = "/home/genai/Vishnu/psearch-master/reinvent-local-main/results/linkinvent_rigid"
batch_size         = 8
unique_sequences   = true
randomize_smiles   = true

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 25
minscore    = 0.2

[[stage]]
chkpt_file  = "/home/genai/Vishnu/psearch-master/reinvent-local-main/models/linkinvent_2.chkpt"
termination = "simple"
max_score   = 1.0
min_steps   = 50
max_steps   = 200

[stage.scoring]
type = "geometric_mean"

# ── 1. Low sp3 in linker (FractionCSP3 <= 0.15 → 1, else 0) ─────────────────
[[stage.scoring.component]]
[stage.scoring.component.FragmentCsp3]
[[stage.scoring.component.FragmentCsp3.endpoint]]
name           = "LowLinkerCsp3"
weight         = 1.0
transform.type = "left_step"
transform.low  = 0.15

# ── 2. Zero rotatable bonds in linker (exactly 0 → 1, else 0) ────────────────
[[stage.scoring.component]]
[stage.scoring.component.FragmentNumRotBond]
[[stage.scoring.component.FragmentNumRotBond.endpoint]]
name           = "ZeroRotBonds"
weight         = 1.0
transform.type = "step"
transform.low  = 0
transform.high = 0

# ── 3. Effective linker span 7–11 bonds between warhead attachments ─────────
[[stage.scoring.component]]
[stage.scoring.component.FragmentEffectiveLength]
[[stage.scoring.component.FragmentEffectiveLength.endpoint]]
name           = "LinkerSpan_7_11"
weight         = 1.0
transform.type = "step"
transform.low  = 7
transform.high = 11

# ── 4. GNINA docking (tiered: <=-12 → 1.0, (-12,-10] → 0.5, >-10 → 0.0) ───
[[stage.scoring.component]]
[stage.scoring.component.DockingScore]
[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingReward"
weight                  = 3.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"

[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingAffinity_raw"
weight                  = 0.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"
