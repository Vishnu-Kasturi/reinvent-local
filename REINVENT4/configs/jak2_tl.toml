run_type = "transfer_learning"
device   = "mps"
tb_logdir       = "../tb_jak2_TL"
json_out_config = "json_jak2_TL.json"

[parameters]
num_epochs          = 150
batch_size          = 128
save_every_n_epochs = 10

# Paths relative to REINVENT4/ directory
input_model_file          = "priors/reinvent.prior"
smiles_file               = "../data/jak2_tl_train.smi"
validation_smiles_file    = "../data/jak2_tl_val.smi"
output_model_file         = "../models/jak2_tl.model"

standardize_smiles  = true
randomize_smiles    = true
shuffle_each_epoch  = true
clip_gradient_norm  = 0.5

# ── Scheduler: lr=5e-5, freeze_n_layers=2 ────────────────────────────────────
# freeze_n_layers=2 → freeze embedding + LSTM 0
#                    LSTM 1, LSTM 2 + linear head are trainable.
[scheduler]
lr              = 0.00005
step            = 20
gamma           = 0.90
weight_decay    = 0.0
freeze_n_layers = 2
