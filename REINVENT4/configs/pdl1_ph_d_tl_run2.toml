run_type        = "transfer_learning"
device          = "mps"
tb_logdir       = "../tb_pdl1_ph_d_TL_run2"
json_out_config = "json_pdl1_ph_d_tl_run2.json"

[parameters]
num_epochs          = 150
batch_size          = 32
save_every_n_epochs = 10

# Dataset: filtered_smiles_tanimoto (652 unique, 521 train / 131 val)
input_model_file          = "/Users/vishnukasturi/Intern/reinvent-local/REINVENT4/priors/reinvent.prior"
smiles_file               = "/Users/vishnukasturi/Intern/reinvent-local/data/ph_d_tl_train.smi"
validation_smiles_file    = "/Users/vishnukasturi/Intern/reinvent-local/data/ph_d_tl_val.smi"
output_model_file         = "/Users/vishnukasturi/Intern/reinvent-local/models/pdl1_ph_d_tl_run2.model"

standardize_smiles  = true
randomize_smiles    = true
shuffle_each_epoch  = true
clip_gradient_norm  = 0.5

# ── Scheduler: lr=3e-5, freeze_n_layers=3 ────────────────────────────────────
# freeze_n_layers=3 → freeze embedding + LSTM 0 + LSTM 1
#                    Only LSTM 2 + linear head are trainable.
# Lower lr (3e-5) to avoid rapid Tanimoto drift seen in run1 (freeze_n_layers=1).
[scheduler]
lr              = 0.00003
step            = 20
gamma           = 0.90
weight_decay    = 0.0
freeze_n_layers = 3
