##############################################################################
# pd1_pdl1_libinvent_pic50_sol_dock.toml
# LibInvent RL — only 3 rewards (geometric mean):
#   PD1PDL1Sol     weight 5.0
#   DockingReward  weight 3.0
#   PD1PDL1pIC50   weight 2.0
##############################################################################

run_type = "staged_learning"
device   = "cuda:1"
tb_logdir       = "/home/genai/Vishnu/psearch-master/reinvent-local-main/tb_libinvent_pic50_sol_dock"
json_out_config = "/home/genai/Vishnu/psearch-master/reinvent-local-main/json_libinvent_pic50_sol_dock.json"

[parameters]
prior_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/libinvent.prior"
agent_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/libinvent.prior"
smiles_file        = "/home/genai/Vishnu/psearch-master/reinvent-local-main/data/iict_lib4.smi"
summary_csv_prefix = "/home/genai/Vishnu/psearch-master/reinvent-local-main/results/libinvent_pic50_sol_dock"
batch_size         = 16
unique_sequences   = true
randomize_smiles   = true
use_checkpoint     = false

[learning_strategy]
type  = "dap"
sigma = 96
rate  = 0.00005

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 25
minscore    = 0.35

[[stage]]
chkpt_file  = "/home/genai/Vishnu/psearch-master/reinvent-local-main/models/libinvent_pic50_sol_dock.chkpt"
termination = "simple"
max_score   = 0.85
min_steps   = 150
max_steps   = 400

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.PD1PDL1Sol]
[[stage.scoring.component.PD1PDL1Sol.endpoint]]
name               = "PD1PDL1Sol"
weight             = 5.0
transform.type     = "double_sigmoid"
transform.low      = -4.0
transform.high     = 2.0
transform.coef_div = 100.0
transform.coef_si  = 10.0
transform.coef_se  = 10.0
params.model_path  = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/Preprocess/final_acc/pd1_pdl1_sol_final_acc_model.ubj"]
params.scaler_path = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/Preprocess/final_acc/pd1_pdl1_sol_final_acc_scaler.pkl"]

[[stage.scoring.component]]
[stage.scoring.component.DockingScore]
[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingReward"
weight                  = 3.0
params.receptor_path    = ["/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"]
params.autobox_ligand   = ["/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"]
params.gnina_executable = ["/home/genai/Documents/gnina/gnina"]
params.output_root      = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"]
params.cnn_scoring      = ["none"]
params.keep_outputs     = ["true"]

[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingAffinity_raw"
weight                  = 0.0
params.receptor_path    = ["/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"]
params.autobox_ligand   = ["/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"]
params.gnina_executable = ["/home/genai/Documents/gnina/gnina"]
params.output_root      = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"]
params.cnn_scoring      = ["none"]
params.keep_outputs     = ["true"]

[[stage.scoring.component]]
[stage.scoring.component.PD1PDL1pIC50]
[[stage.scoring.component.PD1PDL1pIC50.endpoint]]
name               = "PD1PDL1pIC50"
weight             = 2.0
transform.type     = "sigmoid"
transform.low      = 5.0
transform.high     = 12.0
transform.k        = 0.4
params.model_path  = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/Preprocess/final_acc/pd1_pdl1_pic50_final_acc_model.ubj"]
params.scaler_path = ["/home/genai/Vishnu/psearch-master/reinvent-local-main/Preprocess/final_acc/pd1_pdl1_pic50_final_acc_scaler.pkl"]
