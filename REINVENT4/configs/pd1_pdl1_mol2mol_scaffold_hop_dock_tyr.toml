##############################################################################
# pd1_pdl1_mol2mol_scaffold_hop_dock_tyr.toml
# Mol2Mol RL — explore NEW scaffolds from a lead SMILES
#
# Prior (similarity to input during generation):
#   mol2mol_scaffold_generic.prior  → LOW similarity / scaffold hop (default)
#   mol2mol_medium_similarity.prior → MEDIUM similarity (comment swap below)
#
# Rewards: docking + tyrosine + low-Tanimoto-to-lead + physchem (NO pIC50/sol)
#
# Setup:
#   1. Put your lead/scaffold SMILES in ../data/scaffold_hop_lead.smi (1 per line)
#   2. Copy the SAME SMILES into TanimotoSimilarity params.smiles below
#   3. Run from REINVENT4/:
#        reinvent configs/pd1_pdl1_mol2mol_scaffold_hop_dock_tyr.toml
##############################################################################

run_type        = "staged_learning"
device          = "cuda:0"
tb_logdir       = "../tb_mol2mol_scaffold_hop"
json_out_config = "json_mol2mol_scaffold_hop.json"

[parameters]
# ── LOW similarity (scaffold hop) — default ──────────────────────────────────
prior_file         = "priors/mol2mol_scaffold_generic.prior"
agent_file         = "priors/mol2mol_scaffold_generic.prior"
# ── MEDIUM similarity — uncomment these and comment the two lines above ───────
# prior_file         = "priors/mol2mol_medium_similarity.prior"
# agent_file         = "priors/mol2mol_medium_similarity.prior"

smiles_file        = "../data/scaffold_hop_lead.smi"
sample_strategy    = "multinomial"
distance_threshold = 100
summary_csv_prefix = "../results/mol2mol_scaffold_hop"
batch_size         = 8
unique_sequences   = true
randomize_smiles   = true

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 12
minscore    = 0.25

[[stage]]
chkpt_file  = "../models/mol2mol_scaffold_hop.chkpt"
termination = "simple"
max_score   = 1.0
min_steps   = 40
max_steps   = 120

[stage.scoring]
type = "arithmetic_mean"

# ── 1. Penalize staying too similar to input lead (reward scaffold change) ─────
# reverse_sigmoid: Tanimoto < ~0.3 → high score; > ~0.55 → low score
[[stage.scoring.component]]
[stage.scoring.component.TanimotoSimilarity]
[[stage.scoring.component.TanimotoSimilarity.endpoint]]
name              = "ScaffoldHop"
weight            = 2.0
transform.type    = "reverse_sigmoid"
transform.low     = 0.25
transform.high    = 0.55
transform.k       = 0.4
params.smiles     = ["REPLACE_WITH_SAME_SMILES_AS_scaffold_hop_lead.smi"]
params.radius     = [2]
params.use_counts = [false]
params.use_features = [false]

# ── 2. GNINA docking ─────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.DockingScore]
[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingReward"
weight                  = 3.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"

[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingAffinity_raw"
weight                  = 0.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"

# ── 3. Tyrosine pi-stacking (TYR56) ──────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.TyrosineInteraction]
[[stage.scoring.component.TyrosineInteraction.endpoint]]
name                    = "TyrInteractionReward"
weight                  = 2.5
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"
params.tyr_residue      = "56"

[[stage.scoring.component.TyrosineInteraction.endpoint]]
name                    = "TyrInteractionCount_raw"
weight                  = 0.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"
params.tyr_residue      = "56"

# ── 4. Low sp3 character (flat / aromatic / fused-friendly) ──────────────────
[[stage.scoring.component]]
[stage.scoring.component.Csp3]
[[stage.scoring.component.Csp3.endpoint]]
name           = "LowCsp3"
weight         = 1.5
transform.type = "reverse_sigmoid"
transform.low  = 0.05
transform.high = 0.45
transform.k    = 0.4

# ── 5. Rigid molecules (few rotatable bonds) ─────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.NumRotBond]
[[stage.scoring.component.NumRotBond.endpoint]]
name           = "LowRotBonds"
weight         = 1.5
transform.type = "reverse_sigmoid"
transform.low  = 0
transform.high = 6
transform.k    = 0.35

# ── 6. Multi-ring / biaryl / fused aromatics (2–4 aromatic rings) ────────────
[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]
[[stage.scoring.component.NumAromaticRings.endpoint]]
name           = "AromaticRings_2_4"
weight         = 1.5
transform.type = "step"
transform.low  = 2
transform.high = 4

# ── 7. Total ring count (fused systems often 3+) ─────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.NumRings]
[[stage.scoring.component.NumRings.endpoint]]
name           = "MultiRing"
weight         = 1.0
transform.type = "sigmoid"
transform.low  = 2
transform.high = 5
transform.k    = 0.35
