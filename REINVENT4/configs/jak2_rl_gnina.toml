run_type        = "staged_learning"
device          = "cuda"
tb_logdir       = "../tb_jak2_rl_gnina"
json_out_config = "json_jak2_rl_gnina.json"

[parameters]
use_checkpoint     = false
summary_csv_prefix = "../results/jak2_rl_gnina"

prior_file = "priors/reinvent.prior"
agent_file = "../models/jak2_TL.model.80.chkpt"

batch_size        = 16
unique_sequences  = true
randomize_smiles  = true

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 8
minscore    = 0.35

[inception]
smiles_file = "../data/jak2_TL_train.smi"
memory_size = 200
sample_size = 20

##############################################################################
# STAGE 1: QSAR + Docking (reduce batch_size when docking on-the-fly)
##############################################################################
[[stage]]
chkpt_file  = "../models/jak2_rl_gnina_stage1.chkpt"
termination = "simple"
max_score   = 1.0
min_steps   = 50
max_steps   = 200

[stage.scoring]
type = "geometric_mean"

# ── QED ───────────────────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 1.0

# ── JAK2 pIC50 (fast QSAR pre-filter) ─────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.JAK2pIC50]
[[stage.scoring.component.JAK2pIC50.endpoint]]
name               = "JAK2pIC50"
weight             = 2.0
params.model_path  = ["../Preprocess/final_acc/jak2_pic50_final_acc_model.ubj"]
params.scaler_path = ["../Preprocess/final_acc/jak2_pic50_final_acc_scaler.pkl"]

# ── Gnina Docking (on-the-fly) ────────────────────────────────────────────────
# More negative affinity = better binding. reverse_sigmoid maps -12→1.0, -6→0.0
[[stage.scoring.component]]
[stage.scoring.component.GninaDock]
[[stage.scoring.component.GninaDock.endpoint]]
name                    = "GninaAffinity"
weight                  = 3.0
transform.type          = "reverse_sigmoid"
transform.high          = -6.0
transform.low           = -12.0
transform.k             = 0.3
params.receptor_path    = ["../docking/receptor.pdbqt"]
params.gnina_executable = ["gnina"]
# Option A: explicit grid box (replace with your values from prepare_receptor_for_gnina.py)
params.center_x         = ["0.0"]
params.center_y         = ["0.0"]
params.center_z         = ["0.0"]
params.size_x           = ["20.0"]
params.size_y           = ["20.0"]
params.size_z           = ["20.0"]
# Option B: autobox from co-crystal ligand (uncomment and remove center/size above)
# params.autobox_ligand = ["../docking/ref_ligand.sdf"]
# params.autobox_add    = ["4.0"]
params.exhaustiveness   = ["4"]
params.num_modes        = ["1"]
params.cnn_scoring      = ["rescore"]
params.docking_mode     = ["full"]
params.n_workers        = ["4"]
params.use_gpu          = ["true"]
params.cache_dir        = ["../docking/gnina_cache"]

[[stage.scoring.component.GninaDock.endpoint]]
name                    = "GninaAffinity_raw"
weight                  = 0.0
params.receptor_path    = ["../docking/receptor.pdbqt"]
params.gnina_executable = ["gnina"]
params.center_x         = ["0.0"]
params.center_y         = ["0.0"]
params.center_z         = ["0.0"]
params.size_x           = ["20.0"]
params.size_y           = ["20.0"]
params.size_z           = ["20.0"]
params.exhaustiveness   = ["4"]
params.num_modes        = ["1"]
params.cnn_scoring      = ["rescore"]
params.docking_mode     = ["full"]
params.n_workers        = ["4"]
params.use_gpu          = ["true"]
params.cache_dir        = ["../docking/gnina_cache"]
