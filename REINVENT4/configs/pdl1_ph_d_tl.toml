run_type        = "transfer_learning"
device          = "mps"
tb_logdir       = "../tb_pdl1_ph_d_TL"
json_out_config = "json_pdl1_ph_d_tl.json"

[parameters]
num_epochs          = 150
batch_size          = 32
save_every_n_epochs = 10

# Dataset: filtered_smiles_tanimoto (652 unique, 521 train / 131 val)
input_model_file          = "/Users/vishnukasturi/Intern/reinvent-local/REINVENT4/priors/reinvent.prior"
smiles_file               = "/Users/vishnukasturi/Intern/reinvent-local/data/ph_d_tl_train.smi"
validation_smiles_file    = "/Users/vishnukasturi/Intern/reinvent-local/data/ph_d_tl_val.smi"
output_model_file         = "/Users/vishnukasturi/Intern/reinvent-local/models/pdl1_ph_d_tl.model"

standardize_smiles  = true
randomize_smiles    = true
shuffle_each_epoch  = true
clip_gradient_norm  = 0.5

# ── Scheduler: lr=5e-5, freeze_n_layers=1 ────────────────────────────────────
# freeze_n_layers=1 → freeze embedding only; LSTM 0,1,2 + linear head are trained
# This "unfreezes last layer" strategy lets the full RNN adapt to the new chemotype.
[scheduler]
lr              = 0.00005
step            = 20
gamma           = 0.90
weight_decay    = 0.0
freeze_n_layers = 1
