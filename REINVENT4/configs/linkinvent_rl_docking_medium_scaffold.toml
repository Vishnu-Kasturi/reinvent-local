##############################################################################
# linkinvent_rl_docking_medium_scaffold.toml
# LinkInvent RL — medium linker scaffolds (biaryl / 2–3 aromatic rings)
#
# Targets:
#   - 2–3 aromatic rings in linker (biaryl, fused biaryl, naphthalene-type, etc.)
#   - Low sp3, ≤1 rot bond (allows classic Ph–Ph biaryl)
#   - Medium span 4–9 bonds (not tiny 1-ring, not huge chain)
#   - GNINA docking
#
# Why rigid.toml gave 1-ring linkers:
#   - ZeroRotBonds blocks Ph–Ph (1 rot bond) → only fused/single-ring survives
#   - LinkerSpan_7_11 measures bond distance, NOT ring count
#   - No reward for aromatic ring count
#
# Run:
#   reinvent REINVENT4/configs/linkinvent_rl_docking_medium_scaffold.toml
##############################################################################

run_type        = "staged_learning"
device          = "cuda:0"
tb_logdir       = "tb_linkinvent_medium"
json_out_config = "json_linkinvent_medium.json"

[parameters]
prior_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/linkinvent.prior"
agent_file         = "/home/genai/Vishnu/psearch-master/reinvent-local-main/REINVENT4/priors/linkinvent.prior"
smiles_file        = "/home/genai/Vishnu/psearch-master/reinvent-local-main/data/warheads_1.smi"
summary_csv_prefix = "/home/genai/Vishnu/psearch-master/reinvent-local-main/results/linkinvent_medium"
batch_size         = 8
unique_sequences   = true
randomize_smiles   = true

[learning_strategy]
type  = "dap"
sigma = 128
rate  = 0.0001

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 25
minscore    = 0.2

[[stage]]
chkpt_file  = "/home/genai/Vishnu/psearch-master/reinvent-local-main/models/linkinvent_2.chkpt"
termination = "simple"
max_score   = 1.0
min_steps   = 50
max_steps   = 200

[stage.scoring]
type = "geometric_mean"

# ── 1. Low sp3 in linker ─────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.FragmentCsp3]
[[stage.scoring.component.FragmentCsp3.endpoint]]
name           = "LowLinkerCsp3"
weight         = 1.0
transform.type = "left_step"
transform.low  = 0.20

# ── 2. Aromatic ring count in linker: exactly 2 or 3 rings ───────────────────
# biaryl, naphthalene (2 fused), phenyl–pyridine, 3-ring systems, etc.
[[stage.scoring.component]]
[stage.scoring.component.FragmentNumAromaticRings]
[[stage.scoring.component.FragmentNumAromaticRings.endpoint]]
name           = "AromaticRings_2_3"
weight         = 2.0
transform.type = "step"
transform.low  = 2
transform.high = 3

# ── 3. Block saturated rings in linker (cyclohexyl, piperidine ring, etc.) ───
[[stage.scoring.component]]
[stage.scoring.component.FragmentNumAliphaticRings]
[[stage.scoring.component.FragmentNumAliphaticRings.endpoint]]
name           = "NoAliphaticRings"
weight         = 1.0
transform.type = "left_step"
transform.low  = 0

# ── 4. Rot bonds: 0 or 1 (allows Ph–Ph biaryl; blocks floppy chains) ───────
[[stage.scoring.component]]
[stage.scoring.component.FragmentNumRotBond]
[[stage.scoring.component.FragmentNumRotBond.endpoint]]
name           = "RotBonds_0_1"
weight         = 1.0
transform.type = "step"
transform.low  = 0
transform.high = 1

# ── 5. Medium span 4–9 bonds between warhead attachments ───────────────────
# secondary shape gate — stops tiny 1-ring, avoids huge extended chains
[[stage.scoring.component]]
[stage.scoring.component.FragmentEffectiveLength]
[[stage.scoring.component.FragmentEffectiveLength.endpoint]]
name           = "LinkerSpan_4_9"
weight         = 1.0
transform.type = "step"
transform.low  = 4
transform.high = 9

# ── 6. GNINA docking ─────────────────────────────────────────────────────────
[[stage.scoring.component]]
[stage.scoring.component.DockingScore]
[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingReward"
weight                  = 3.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"

[[stage.scoring.component.DockingScore.endpoint]]
name                    = "DockingAffinity_raw"
weight                  = 0.0
params.receptor_path    = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/receptor.pdb"
params.autobox_ligand   = "/home/genai/navneet/iict/pdl1/docking_TL_dataset/ref_ligand.pdb"
params.gnina_executable = "/home/genai/Documents/gnina/gnina"
params.output_root      = "/home/genai/Vishnu/psearch-master/reinvent-local-main/docking_runs"
params.cnn_scoring      = "none"
params.keep_outputs     = "true"
